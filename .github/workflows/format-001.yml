name: نسخ تنسيق 001 على كل الملفات
on: workflow_dispatch
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          import os, re
          # 1- نقرأ تنسيق الملف 001 الصحيح من الصورة
          with open('001-majlis-chaabi.html','r',encoding='utf-8',errors='ignore') as f:
              c001=f.read()
          
          m=re.search(r'<style[^>]*>(.*?)</style>', c001, re.DOTALL|re.IGNORECASE)
          if m and len(m.group(1))>100:
              style001=m.group(1)
          else:
              # هذا هو نفس تنسيق 001 لي في صورتك - خلفية فاتحة + بطاقات بيضاء + حدود زرقاء
              style001="""
          body{background:#f0f8ff !important;margin:0 !important;padding:0 !important;font-family:Tahoma, Arial !important;}
          h1{color:#0e6ba8 !important;text-align:center !important;font-size:30px !important;font-weight:900 !important;line-height:1.6 !important;padding:18px 10px !important;margin:0 !important;background:transparent !important;border:none !important;}
          h2{color:#0e6ba8 !important;text-align:center !important;font-size:24px !important;}
          div, section, article{
            background:#ffffff !important;
            border:2.5px solid #0e6ba8 !important;
            border-radius:14px !important;
            padding:16px !important;
            margin:14px 12px !important;
            font-size:22px !important;
            line-height:1.9 !important;
            font-weight:600 !important;
            color:#111 !important;
            text-align:right !important;
          }
          li, p, ul{font-size:21px !important;line-height:1.9 !important;color:#111 !important;}
          a{color:#0e6ba8 !important;}
              """

          for fname in os.listdir('.'):
              if not fname.endswith('.html'): continue
              if fname in ('index.html','001-majlis-chaabi.html'): continue
              
              with open(fname,'r',encoding='utf-8',errors='ignore') as f:
                  content=f.read()
              
              # نستخرج محتوى الـ body فقط
              bm=re.search(r'<body[^>]*>(.*?)</body>', content, re.DOTALL|re.IGNORECASE)
              body_inner=bm.group(1) if bm else content
              
              # نحذف أي ستايل قديم داخل body
              body_inner=re.sub(r'<style[^>]*>.*?</style>','',body_inner,flags=re.DOTALL|re.IGNORECASE)
              
              # نبني ملف جديد بنفس هيكل 001
              new_html=f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>{fname}</title>
          <style>{style001}</style>
          </head>
          <body>
          {body_inner}
          </body>
          </html>"""
              with open(fname,'w',encoding='utf-8') as out:
                  out.write(new_html)
          print("تم نسخ تنسيق 001 على كل الملفات")
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "نسخ تنسيق الملف 001 الصحيح على كل الملفات" || exit 0
          git push
