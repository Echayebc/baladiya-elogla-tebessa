name: تكبير الخط
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in *.html; do
            if ! grep -q "style.css" "$f"; then
              sed -i 's|</head>|<link rel="stylesheet" href="style.css"></head>|' "$f"
            fi
          done
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "تكبير الخط العملاق" || exit 0
          git push
