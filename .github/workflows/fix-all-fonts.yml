name: إصلاح الخط العملاق نهائيا
on: [push, workflow_dispatch]

# هذا السطر هو اللي يصلح مشكلة الصورة 403
permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: تكبير خط كل الصفحات
        run: |
          cat > style.css << 'CSS'
          *{font-size:34px !important;line-height:2.2 !important;font-weight:800 !important;font-family:Tahoma, Arial !important}
          body{background:#ffffe8 !important;padding:12px !important}
          h1{font-size:42px !important;color:#b80000 !important;text-align:center !important}
          li{font-size:32px !important;margin-bottom:18px !important}
          CSS
          
          for f in *.html; do
            if [[ "$f" != "index.html" ]]; then
              sed -i 's/font-size:[ ]*11px/font-size:34px/g' "$f" || true
              sed -i 's/font-size:[ ]*12px/font-size:34px/g' "$f" || true
              sed -i 's/font-size:[ ]*13px/font-size:34px/g' "$f" || true
              sed -i 's/font-size:[ ]*14px/font-size:34px/g' "$f" || true
              if ! grep -q "style.css" "$f"; then
                sed -i 's|</head>|<link rel="stylesheet" href="style.css"></head>|' "$f" || true
              fi
            fi
          done
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "إصلاح الخط العملاق نهائيا - 34px" || echo "لا يوجد تغيير"
          git push
