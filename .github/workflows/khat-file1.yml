name: جعل كل النوافذ بنفس خط الملف 1
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in *.html; do
            if [[ "$f" != "index.html" ]]; then
              # نحذف الستايل الصغير القديم
              sed -i '/<style>/,/<\/style>/d' "$f"
              # نضيف رابط style.css الموحد اذا لم يكن موجود
              if ! grep -q "style.css" "$f"; then
                sed -i 's|</head>|<link rel="stylesheet" href="style.css">\n</head>|' "$f"
              fi
            fi
          done
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "توحيد كل النوافذ بنفس خط الملف 1" || exit 0
          git push
