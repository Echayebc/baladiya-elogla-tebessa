name: بناء APK بلدية العقلة

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الملفات
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Baladiya Ogla" "dz.baladiya.ogla" --web-dir=.

      - name: إضافة منصة أندرويد
        run: |
          npx cap add android
          npx cap copy android

      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: رفع APK للتحميل من GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "تطبيق بلدية العقلة APK - تحميل مباشر"
          body: |
            ✅ تطبيق رسمي
            ✅ بدون إعلانات
            ✅ بدون أنترنت
            ✅ مخفي المصدر - لا يظهر github في الواجهة
            تحميل مباشر من GitHub
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
