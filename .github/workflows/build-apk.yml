name: تجهيز تطبيق ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: صنع ملف ZIP للتطبيق
        run: |
          rm -rf .git .github
          zip -r baladiya-elogla-app.zip *.html manifest.json sw.js 2>/dev/null || zip -r baladiya-elogla-app.zip *.html
          ls -lh *.zip

      - name: نشر ZIP للتحميل المباشر من GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: app-v${{ github.run_number }}
          name: تطبيق بلدية العقلة - تحميل مباشر ZIP
          body: |
            ✅ تحميل مباشر من GitHub بدون إعلانات
            ✅ فك الضغط وستجد index.html يشتغل بدون أنترنت
            ✅ يمكن تثبيته كتطبيق من المتصفح (Add to Home Screen)
            ✅ مخفي المصدر - لا تظهر كلمة github في واجهة التطبيق
          files: baladiya-elogla-app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
