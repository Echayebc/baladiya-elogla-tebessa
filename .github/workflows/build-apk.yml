name: بناء APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تجهيز وبناء
        run: |
          rm -f package.json package-lock.json
          rm -rf node_modules android www
          mkdir www
          cp -r *.html manifest.json sw.js www/ 2>/dev/null || cp -r *.html www/
          echo '{"name":"baladiya","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Baladiya Ogla" "dz.baladiya.ogla" --web-dir=www
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: نشر APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-v${{ github.run_number }}
          name: تطبيق بلدية العقلة
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
