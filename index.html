<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلدية العقلة - 150 مصلحة</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e6ba8">
<style>body{background:#eef6ff;margin:0;font-family:Tahoma}.top-bar{background:#fff;border-bottom:3px solid #0e6ba8;display:flex;align-items:center;gap:12px;padding:10px}.top-bar img{width:70px;height:70px;border-radius:50%;border:2px solid #0e6ba8}.header{background:#0e6ba8;color:#fff;text-align:center;padding:12px;border-radius:0 0 20px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#fff;border:3px solid #0e6ba8;border-radius:16px;min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:8px}.card span{color:#0e6ba8;font-weight:900}.card b{color:#000;font-size:13px}</style>
</head>
<body>
<div class="top-bar"><img src="khadar.jpg"><div><b>الطاهر خضار</b><br><span style="font-size:11px">بلدية العقلة تبسة - 150 مصلحة</span></div></div>
<div class="header"><h2>بلدية العقلة - 150 مصلحة بالعربية</h2></div>
<div class="grid" id="grid"></div>
<script src="masalih-data.js?v=3"></script>
<script>
let h=""; MASALIH.forEach(o=>{ h+=`<a class="card" href="${o.file}"><span>${o.num}</span><b>${o.ar}</b></a>`; });
document.getElementById('grid').innerHTML=h;
</script>
</body>
</html>
