async function load(){
 try{
  const res=await fetch('https://api.github.com/repos/echayebc/baladiya-elogla-tebessa/contents');
  const files=await res.json();
  const htmlFiles=files.filter(f=>f.name.endsWith('.html') && /^\d{3}-/.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
  let html="";
  htmlFiles.forEach(f=>{
    let num=f.name.substring(0,3);
    let name=arNames[num]||f.name;
    html+=`<a class="card" href="${f.name}"><span>${num}</span><b>${name}</b></a>`;
  });
  document.getElementById('grid').innerHTML=html;
  document.getElementById('loading').innerHTML=`تم العثور على ${htmlFiles.length} ملف فعلي - لن يظهر خطأ 404 بعد الآن`;
 }catch(e){
  document.getElementById('loading').innerHTML='خطأ في الاتصال، جرب تحديث الصفحة';
 }
}
load();
