<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلدية العقلة - الطاهر خضار</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e6ba8">
<link rel="icon" href="khadar.jpg">
<style>
body{background:#eef6ff;margin:0;font-family:Tahoma;padding-bottom:20px}
.top-bar{background:#fff;border-bottom:3px solid #0e6ba8;display:flex;align-items:center;gap:12px;padding:10px}
.top-bar img{width:70px;height:70px;border-radius:50%;border:2px solid #0e6ba8;object-fit:cover}
.top-bar b{color:#0e6ba8;font-size:15px}
.top-bar span{font-size:12px;font-weight:700;color:#333;display:block}
.header{background:#0e6ba8;color:#fff;text-align:center;padding:18px;border-radius:0 0 20px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border:3px solid #0e6ba8;border-radius:16px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:8px}
.card span{color:#0e6ba8;font-weight:900;font-size:13px}
.card b{color:#000;font-size:14px;margin:4px 0}
.card small{font-size:10px;color:#777;word-break:break-all}
#loading{text-align:center;padding:20px;color:#0e6ba8;font-weight:900}
</style>
</head>
<body>
<div class="top-bar"><img src="khadar.jpg"><div><b>من إعداد المترشح: الطاهر خضار</b><span>بطاقة فنية غير رسمية - بلدية العقلة تبسة</span></div></div>
<div class="header"><h1>بلدية العقلة - ولاية تبسة</h1></div>
<div id="loading">جاري تحميل الملفات الحقيقية...</div>
<div class="grid" id="grid"></div>
<script>
// قاموس الترجمة - الفرنسية / الانجليزية -> عربية
const tarjama={
"majlis chaabi":"المجلس الشعبي البلدي",
"raiss majlis":"رئيس المجلس الشعبي",
"noab raiss":"نواب الرئيس",
"mandoubine khassine":"المندوبين الخاصين",
"amin aam":"الأمين العام للبلدية",
"liian daima":"اللجان الدائمة",
"maslahat hala madania":"مصلحة الحالة المدنية",
"maslahat biomtri":"مصلحة البيومتري",
"maslahat choun ijtimaia":"مصلحة الشؤون الاجتماعية",
"maslahat tachghil":"مصلحة التشغيل",
"maslahat tarbia":"مصلحة التربية",
"maslahat siha":"مصلحة الصحة",
"maslahat bina":"مصلحة البناء والتعمير",
"maslahat mali":"المصلحة المالية",
"maslahat mostakhdamin":"مصلحة المستخدمين",
"maslahat hifz":"مصلحة الحفظ",
"maslahat tanzim":"مصلحة التنظيم",
"maslahat achghal":"مصلحة الأشغال",
"maslahat nadhafa":"مصلحة النظافة",
"maslahat miyah":"مصلحة المياه"
};

async function load(){
  try{
    const res = await fetch('https://api.github.com/repos/echayebc/baladiya-elogla-tebessa/contents?per_page=200');
    const files = await res.json();
    const list = files.filter(f=>f.name.endsWith('.html') && /^\d{3}-/.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
    let h="";
    list.forEach(f=>{
      let num=f.name.substring(0,3);
      let clean=f.name.replace('.html','').replace(/^\d{3}-/,'').replace(/-/g,' ').toLowerCase().trim();
      let arName = tarjama[clean] || clean; // إذا ما لقاش الترجمة يخلي الاسم الأصلي
      // إذا الاسم ما تترجمش نحاول نترجم كلمة بكلمة
      if(arName===clean){
        arName = clean.replace(/maslahat/g,'مصلحة ').replace(/majlis/g,'مجلس ').replace(/raiss/g,'رئيس ');
      }
      h+=`<a class="card" href="${f.name}"><span>${num}</span><b>${arName}</b><small>${f.name}</small></a>`;
    });
    document.getElementById('grid').innerHTML=h;
    document.getElementById('loading').innerHTML=`تم تحميل ${list.length} ملف - كل الملفات تفتح الآن`;
  }catch(e){
    document.getElementById('loading').innerHTML="خطأ في التحميل - افتح في Chrome وجرب مرة أخرى";
  }
}
load();

// لا نحجز api.github.com في الكاش
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js?v=8');
}
</script>
</body>
</html>
