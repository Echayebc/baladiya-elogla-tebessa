<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلدية العقلة - تبسة</title>
<style>
body{background:#eef6ff;margin:0;font-family:Tahoma}
.header{background:#0e6ba8;color:#fff;text-align:center;padding:20px;border-radius:0 0 20px 20px}
.header h1{font-size:28px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border:3px solid #0e6ba8;border-radius:16px;color:#0e6ba8;font-weight:900;font-size:16px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:10px;line-height:1.3}
.card b{font-size:18px;color:#111;margin-top:4px}
#loading{text-align:center;padding:20px;font-size:22px;color:#0e6ba8}
</style>
</head>
<body>
<div class="header"><h1>بلدية العقلة - ولاية تبسة<br>150 ملف - الهيكل التنظيمي</h1></div>
<div id="loading">جاري تحميل أسماء الملفات الحقيقية...</div>
<div class="grid" id="grid"></div>

<script>
async function loadFiles(){
  try{
    const res = await fetch('https://api.github.com/repos/Echayebc/baladiya-elogla-tebessa/contents?ref=main');
    const data = await res.json();
    let files = data.filter(f=>f.name.endsWith('.html') && f.name!=='index.html').map(f=>f.name).sort();
    
    let html="";
    files.forEach(fname=>{
      let display = fname.replace('.html','').replace(/^\d+-/,'').replace(/-/g,' ');
      let num = fname.match(/^\d+/) ? fname.match(/^\d+/)[0] : '';
      html+=`<a class="card" href="${fname}"><span>${num}</span><b>${display}</b><small style="font-size:11px;color:#888">${fname}</small></a>`;
    });
    document.getElementById('grid').innerHTML=html;
    document.getElementById('loading').style.display='none';
    
    if(files.length < 115){
      document.getElementById('loading').innerHTML = "يوجد "+files.length+" ملف فقط في المشروع";
      document.getElementById('loading').style.display='block';
    }
  }catch(e){
    // اذا فشل API نولد 150 يدويا وما يحبسش عند 115
    let html="";
    for(let i=1;i<=150;i++){
      let n=String(i).padStart(3,'0');
      html+=`<a class="card" href="${n}-.html"><span>${n}</span><b>ملف ${n}</b></a>`;
    }
    document.getElementById('grid').innerHTML=html;
    document.getElementById('loading').innerHTML="وضع احتياطي: عرض 150 ملف";
  }
}
loadFiles();
</script>
</body>
</html>
