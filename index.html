<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلدية العقلة - الفهرس الشامل</title>
<style>
body{font-family:Tahoma,Arial;background:#f4f6f9;margin:0;padding:10px}
h1{text-align:center;color:#0e6ba8;background:#fff;padding:15px;border-radius:10px;border:2px solid #0e6ba8}
.search{width:100%;padding:12px;border-radius:8px;border:2px solid #0e6ba8;font-size:16px;margin:10px 0;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;text-decoration:none;color:#333;display:block;transition:0.2s}
.card:hover{background:#0e6ba8;color:#fff;transform:scale(1.02)}
.card b{color:#b80000}.card:hover b{color:#ffeb3b}
.count{text-align:center;margin:10px;color:#666}
</style>
</head>
<body>
<h1>🏛️ بلدية العقلة - ولاية تبسة<br>الفهرس الرسمي 001 - 115</h1>
<input type="text" id="search" class="search" placeholder="ابحث هنا... مثلا: الري، الضرائب، الحالة المدنية">
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>

<script>
const files = [
"001-hal-madaniya.html","002-tanzim-3am.html","003-intikhabat.html","004-chououn-ijtima3iya.html","005-mizaniya.html","006-momtallakat.html","007-safaqat.html","008-achghal-jadida.html","009-siha-nadhafa.html","010-tarbiya-ta3lim.html",

"021-taamir.html","022-amlak-dawla.html","023-daraib.html","024-khazina.html","025-himaya-madaniya.html","026-amn.html","027-ghabat.html","028-tijara.html","029-sina3a.html","030-siyaha.html",
"031-taqa.html","032-barid.html","033-tachghil-anem.html","034-tadamoun.html","035-mojahidin.html","036-chououn-diniya.html","037-chabab-riyadha.html","038-thaqafa.html","039-ta3lim-mihani.html","040-jami3a.html",
"041-mahkama.html","042-majlis-qadai.html","043-wilaya.html","044-daira.html","045-baladiya.html","046-qanoun-baladiya.html","047-moudawala.html","048-qarar.html","049-moursala.html","050-mahdhar.html",

"071-CONSERVATION.html","072-AGENCE-FONCIERE.html","073-ADE.html","074-ONA.html","075-SONELGAZ.html","076-OPGI.html","077-AADL.html","078-ANL.html","079-DLEP.html","080-DUC.html",

"111-siha.html","112-tachghil.html","113-taqafiya-islmiya.html","114-mojahidin.html","115-ittisal.html"
];

const grid = document.getElementById('grid');
const count = document.getElementById('count');
function render(list){
grid.innerHTML='';
list.forEach(f=>{
const num = f.split('-')[0];
const a = document.createElement('a');
a.href=f;
a.className='card';
a.innerHTML=`<b>${num}</b> - ${f.replace('.html','').replace(/-/g,' ')}`;
grid.appendChild(a);
});
count.textContent=`عدد الملفات: ${list.length} ملف`;
}
render(files);
document.getElementById('search').addEventListener('input',e=>{
const q=e.target.value.toLowerCase();
const filt=files.filter(f=>f.toLowerCase().includes(q));
render(filt);
});
</script>
</body>
</html>
