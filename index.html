<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلدية العقلة - ولاية تبسة</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e6ba8">
<style>
*{box-sizing:border-box}
body{background:#eef6ff;font-family:Tahoma,Arial;margin:0;padding:12px;font-size:22px}
.header{border:4px solid #c00000;border-radius:25px;background:#fff;padding:18px;text-align:center;margin-bottom:15px}
.header h2{color:#0e6ba8;margin:5px;line-height:1.9;font-size:28px}
.header p{font-size:20px;line-height:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:3px solid #0e6ba8;border-radius:18px;background:#fff;padding:18px;text-align:center;color:#0e6ba8;font-weight:bold;text-decoration:none;font-size:21px;line-height:1.5;min-height:75px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,0.1)}
.card:hover{background:#0e6ba8;color:#fff;transform:scale(1.03)}
.btn-install{background:#0e6ba8;color:#fff;border:none;padding:15px 25px;border-radius:15px;font-size:22px;font-weight:bold;width:100%;margin:15px 0;cursor:pointer;display:none}
.topbar{text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="header">
<h2>الهيكل التنظيمي الهرمي<br>بلدية العقلة - ولاية تبسة</h2>
<p>19 مقعد حسب المرسوم 26-282 لسنة 2026<br>القانون 10-11 المعدل بالأمر 13-21</p>
</div>

<div class="topbar">
<button id="installBtn" class="btn-install">📲 ثبّت التطبيق على هاتفك</button>
<div id="offlineStatus" style="color:green;font-weight:bold"></div>
</div>

<div class="grid" id="grid"></div>

<script>
// توليد 115 زر تلقائيا مع خط كبير
const container = document.getElementById('grid');
const titles = {
"001":"المجلس الشعبي","002":"رئيس المجلس","003":"نواب الرئيس","004":"المندوبين الخاصين","005":"اللجان الدائمة","006":"الأمين العام","007":"أمانة الرئيس","008":"مكتب الضبط","009":"الأرشيف","010":"الإعلام الآلي",
"011":"مكتب الميلاد","012":"مكتب الزواج","013":"مكتب الوفاة","014":"التصديق والإمضاء","015":"مكتب الإقامة","016":"البيومتري وجواز السفر","017":"الملحقات الإدارية","018":"تنظيم المنازعات","019":"مكتب الجمعيات","020":"مكتب الانتخابات"
};
// توليد باقي الأسماء تلقائيا
for(let i=1;i<=115;i++){
  let num = String(i).padStart(3,'0');
  let name = titles[num] || `ملف رقم ${num}`;
  let a = document.createElement('a');
  a.className='card';
  a.textContent = num + ' ' + name;
  a.href='#';
  a.dataset.num=num;
  container.appendChild(a);
}

// تحميل قائمة الملفات الحقيقية من GitHub
let fileList=[];
fetch('https://api.github.com/repos/Echayebc/baladiya-elogla-tebessa/contents')
.then(r=>r.json()).then(data=>{
  fileList = data.filter(f=>f.name.endsWith('.html')).map(f=>f.name);
  document.getElementById('offlineStatus').textContent = '✅ عدد الملفات الجاهزة: '+fileList.length+' - يشتغل بدون أنترنت بعد أول زيارة';
  document.querySelectorAll('.card').forEach(card=>{
    const num = card.dataset.num;
    let found = fileList.find(n=>n.startsWith(num));
    if(found){
      card.href = found;
      card.onclick = null;
    } else {
      card.style.opacity='0.5';
    }
  });
  // حفظ للـ offline
  if('caches' in window){
    caches.open('baladiya-elogla-v3').then(cache=>{
      fileList.forEach(f=>cache.add(f));
    });
  }
});

// تثبيت Service Worker للعمل بدون انترنت
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}

// زر تثبيت التطبيق
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installBtn').style.display='block';
});
document.getElementById('installBtn').addEventListener('click', ()=>{
  if(deferredPrompt){ deferredPrompt.prompt(); }
});
</script>
</body>
</html>
